<script>
  (() => {
    const area = new URLSearchParams(location.search).get('area');
    if (area === 'pilot') return;
    const stage = area === 'stress' ? 'stress' : 'city';
    for (const suffix of ['-core.json', '-terrain.bin']) {
      const link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'fetch';
      link.crossOrigin = 'anonymous';
      link.href = './data/' + stage + suffix;
      document.head.append(link);
    }
  })();

</defs></svg><main id="map" data-boot="loading" aria-label="Las Palmas de Gran Canaria">

<script>
  (() => {
    const map = document.getElementById('map');
    const boot = document.getElementById('boot');
    const content = document.getElementById('map-content');
    const error = document.getElementById('boot-error');
    const retry = error.querySelector('button');
    let remaining = 25000, started = 0, timer = 0, revealTimer = 0;
    function stop() {
      if (!timer) return;
      clearTimeout(timer);
      timer = 0;
      remaining -= performance.now() - started;
    }
    function fail() {
      if (map.dataset.boot === 'ready' || map.dataset.boot === 'failed') return;
      stop();
      clearTimeout(revealTimer);
      map.dataset.boot = 'failed';
      document.getElementById('status').hidden = true;
      error.hidden = false;
      error.querySelector('p').textContent = 'No se pudo abrir el mapa.';
      retry.focus({preventScroll: true});
      dispatchEvent(new Event('atlas:boot-failed'));
    }
    function arm() {
      if (timer || document.hidden || map.dataset.boot !== 'loading') return;
      started = performance.now();
      timer = setTimeout(fail, Math.max(0, remaining));
    }
    function finishReveal() {
      if (map.dataset.boot !== 'revealing') return;
      clearTimeout(revealTimer);
      map.dataset.boot = 'ready';
      content.inert = false;
      dispatchEvent(new Event('atlas:boot-ready'));
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else arm(); });
    retry.onclick = () => location.reload();
    addEventListener('atlas:boot-error', fail);
    addEventListener('atlas:boot-picker', () => {
      if (map.dataset.boot !== 'loading') return;
      stop();
      map.dataset.boot = 'picker';
    });
    addEventListener('atlas:boot-resume', () => {
      if (map.dataset.boot !== 'picker') return;
      map.dataset.boot = 'loading';
      arm();
    });
    addEventListener('atlas:boot-interrupt', () => {
      if (map.dataset.boot !== 'revealing') return;
      clearTimeout(revealTimer);
      map.dataset.boot = 'loading';
      arm();
    });
    addEventListener('atlas:boot-reveal', () => {
      if (map.dataset.boot !== 'loading') return;
      stop();
      map.dataset.boot = 'revealing';
      revealTimer = setTimeout(finishReveal, 300);
    });
    boot.addEventListener('transitionend', event => { if (event.target === boot) finishReveal(); });
    addEventListener('error', event => {
      if (event.target?.tagName === 'SCRIPT' || event.target?.rel === 'modulepreload') fail();
    }, true);
    arm();
  })();
</script>
<script type="module" src="/src/main.ts"></script></body></html>
